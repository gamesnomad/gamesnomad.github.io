<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Game Deals - Verified Discounts, Pre-orders & Daily Deals | GameNomad</title>
  <meta name="description" content="Discover hand-picked game deals, daily flash sales, upcoming pre-orders, and verified promos for PC, Xbox, PlayStation, and Nintendo."/>
  <link rel="icon" href="logo.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #090B14;
      --bg-surface: #0E1222;
      --panel: #13182E;
      --panel-hover: #1A213D;
      --card: #12172B;
      --card-border: #1E2644;
      --card-border-hover: #3E4D82;
      --line: #1F2746;
      --text: #F1F4FF;
      --text-dim: #CAD1EB;
      --mute: #818BAE;
      --primary: #7C5CFF;
      --primary-glow: rgba(124, 92, 255, 0.35);
      --accent: #FFB547;
      --accent-glow: rgba(255, 181, 71, 0.35);
      --discount: #FF3B62;
      --cyan: #00E5FF;
      --green: #10B981;
      --orange: #FF7A00;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Layout */
    .app-header {
      background: rgba(14, 18, 34, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 12px 24px;
    }
    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.5px;
      color: var(--text);
    }
    .brand img {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 0 10px var(--primary-glow));
    }
    .brand span b { color: var(--accent); }

    /* Search */
    .search-box {
      flex: 1;
      min-width: 240px;
      max-width: 460px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 10px 16px 10px 42px;
      color: var(--text);
      font-size: 14px;
      transition: var(--transition);
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      outline: none;
      background: var(--panel-hover);
    }
    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mute);
      pointer-events: none;
      font-size: 15px;
    }
    .search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mute);
      font-size: 16px;
      padding: 4px;
      display: none;
      border-radius: 50%;
    }
    .search-clear:hover { color: var(--text); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }
    .social-pills { display: flex; gap: 8px; }
    .social-btn {
      padding: 7px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: var(--mute);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .social-btn:hover {
      background: var(--panel-hover);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Main Container */
    .main-content {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px;
      flex: 1;
    }

    /* HERO CAROUSEL (MAX 4) */
    .carousel-section {
      margin-bottom: 36px;
      position: relative;
    }
    .carousel-wrap {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: var(--panel);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      user-select: none;
    }
    .carousel-track {
      position: relative;
      min-height: 420px;
    }
    .carousel-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s ease, transform 0.45s ease;
      transform: scale(0.98);
      display: flex;
      align-items: flex-end;
      background-size: cover;
      background-position: center;
      pointer-events: none;
    }
    .carousel-slide.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
    }
    .carousel-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(9, 11, 20, 0.96) 0%, rgba(9, 11, 20, 0.85) 45%, rgba(9, 11, 20, 0.3) 100%);
    }
    @media (max-width: 768px) {
      .carousel-overlay {
        background: linear-gradient(180deg, rgba(9, 11, 20, 0.4) 0%, rgba(9, 11, 20, 0.95) 70%, rgba(9, 11, 20, 0.98) 100%);
      }
    }
    .carousel-content {
      position: relative;
      z-index: 2;
      padding: 44px;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (max-width: 768px) {
      .carousel-content { padding: 24px 20px; }
      .carousel-track { min-height: 440px; }
    }
    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      border: 1px solid var(--line);
      background: rgba(14, 18, 34, 0.8);
      backdrop-filter: blur(8px);
      color: var(--text-dim);
    }
    .badge.featured-tag {
      background: linear-gradient(135deg, rgba(255, 181, 71, 0.2), rgba(255, 59, 98, 0.2));
      border-color: var(--accent);
      color: var(--accent);
    }
    .badge.store-tag {
      background: rgba(124, 92, 255, 0.2);
      border-color: var(--primary);
      color: #D3C5FF;
    }
    .badge.daily-pill {
      background: rgba(255, 122, 0, 0.2);
      border-color: var(--orange);
      color: #FFAE66;
    }
    .badge.preorder-pill {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .badge.discount-pill {
      background: var(--discount);
      border-color: var(--discount);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 12px;
      box-shadow: 0 4px 14px rgba(255, 59, 98, 0.4);
    }

    .carousel-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.15;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    @media (max-width: 768px) {
      .carousel-title { font-size: 24px; }
    }

    .carousel-desc {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .carousel-price-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 4px 0 6px;
    }
    .price-main {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 18px var(--accent-glow);
    }
    .price-old {
      font-size: 18px;
      color: var(--mute);
      text-decoration: line-through;
    }
    .price-save {
      font-size: 12px;
      color: var(--green);
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 99px;
    }

    .carousel-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #7C5CFF, #5E36FF);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 26px;
      border-radius: var(--radius-md);
      box-shadow: 0 6px 20px var(--primary-glow);
      transition: var(--transition);
      cursor: pointer;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px var(--primary-glow);
      background: linear-gradient(135deg, #8C6DFF, #6B46FF);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      padding: 11px 20px;
      border-radius: var(--radius-md);
      transition: var(--transition);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Carousel Navigation Arrows */
    .carousel-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(14, 18, 34, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: var(--transition);
      cursor: pointer;
    }
    .carousel-nav-btn:hover {
      background: var(--panel-hover);
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-50%) scale(1.08);
    }
    .carousel-prev { left: 16px; }
    .carousel-next { right: 16px; }

    /* Carousel Indicators */
    .carousel-controls-bar {
      position: absolute;
      right: 32px;
      bottom: 24px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(9, 11, 20, 0.75);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--line);
    }
    .carousel-counter {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--mute);
      letter-spacing: 1px;
    }
    .carousel-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .carousel-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--line);
      transition: var(--transition);
      cursor: pointer;
    }
    .carousel-dot.active {
      width: 26px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Filters Bar */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }
    .tabs-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .tabs-row::-webkit-scrollbar { display: none; }
    .tab-btn {
      white-space: nowrap;
      padding: 8px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--mute);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: var(--transition);
      cursor: pointer;
    }
    .tab-btn:hover {
      background: var(--panel-hover);
      color: var(--text);
      border-color: var(--card-border-hover);
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .tab-count {
      font-size: 11px;
      opacity: 0.75;
      background: rgba(0,0,0,0.25);
      padding: 1px 6px;
      border-radius: 99px;
    }

    .sort-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .results-heading {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .results-count {
      font-size: 13px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
      color: var(--mute);
    }
    .sort-select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sort-label { font-size: 13px; color: var(--mute); }
    .sort-select {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      outline: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .sort-select:focus { border-color: var(--primary); }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .game-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      position: relative;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-border-hover);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .card-thumb-wrap {
      position: relative;
      aspect-ratio: 16/9;
      background: var(--bg-surface);
      overflow: hidden;
      cursor: pointer;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }
    .game-card:hover .card-thumb { transform: scale(1.05); }
    .card-overlay-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
    }
    .card-store-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      background: rgba(9, 11, 20, 0.85);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      color: #CAD1EB;
      backdrop-filter: blur(6px);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .card-platforms {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .platform-pill {
      font-size: 10px;
      font-weight: 700;
      color: var(--mute);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .card-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .card-title:hover { color: var(--accent); }

    .card-desc {
      font-size: 12px;
      color: var(--mute);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-pricing-row {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-price-box {
      display: flex;
      flex-direction: column;
    }
    .card-price-current {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .card-price-old {
      font-size: 12px;
      color: var(--mute);
      text-decoration: line-through;
      margin-top: 2px;
    }
    .card-deal-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      cursor: pointer;
    }
    .card-deal-btn:hover {
      background: #8C6DFF;
      box-shadow: 0 4px 14px var(--primary-glow);
      transform: translateY(-1px);
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
    }
    .empty-state h3 {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .empty-state p { color: var(--mute); font-size: 14px; margin-bottom: 18px; }

    /* Modal Dialog */
    dialog#dlg {
      border: 1px solid var(--card-border-hover);
      border-radius: var(--radius-lg);
      background: var(--panel);
      color: var(--text);
      max-width: 600px;
      width: 92%;
      margin: auto;
      padding: 0;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    dialog#dlg::backdrop {
      background: rgba(5, 7, 16, 0.85);
      backdrop-filter: blur(8px);
    }
    .dlg-inner {
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .dlg-thumb {
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .dlg-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(9, 11, 20, 0.8);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      z-index: 10;
    }
    .dlg-close:hover {
      background: var(--discount);
      color: #fff;
    }
    .dlg-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dlg-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
    }
    .dlg-desc {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 6px;
    }
    .dlg-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .dlg-disclosure {
      font-size: 12px;
      color: var(--mute);
      line-height: 1.4;
    }

    /* DEAL SPOTLIGHT POP-UP MODAL */
    .spotlight-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      max-width: 420px;
      width: calc(100vw - 48px);
      background: var(--panel);
      border: 2px solid var(--accent);
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px var(--accent-glow);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: none;
      animation: popupSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes popupSlideIn {
      from { transform: translateY(40px) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .spotlight-header {
      background: linear-gradient(135deg, rgba(255, 181, 71, 0.2), rgba(255, 59, 98, 0.2));
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .spotlight-badge {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .spotlight-close {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mute);
      font-size: 13px;
      cursor: pointer;
    }
    .spotlight-close:hover { color: #fff; background: var(--discount); }
    .spotlight-body {
      padding: 16px;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .spotlight-thumb {
      width: 100px;
      aspect-ratio: 16/9;
      border-radius: var(--radius-sm);
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 1px solid var(--line);
    }
    .spotlight-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .spotlight-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spotlight-pricing {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .spotlight-price {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }
    .spotlight-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, #FFB547, #FF7A00);
      color: #090B14;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      margin-top: 4px;
      transition: var(--transition);
      cursor: pointer;
    }
    .spotlight-cta:hover {
      box-shadow: 0 4px 14px var(--accent-glow);
      transform: translateY(-1px);
    }

    /* Footer */
    footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--line);
      padding: 40px 24px 30px;
      color: var(--mute);
      font-size: 13px;
    }
    .footer-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .footer-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    .footer-links a:hover { color: var(--accent); }
    .footer-disclosure { line-height: 1.6; max-width: 800px; }
    .footer-copy { font-size: 12px; color: #636D8E; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <a href="./" class="brand" aria-label="GameNomad Deals Home">
        <img src="logo.svg" alt="GameNomad Logo" onerror="this.style.display='none'"/>
        <span id="site-brand-name">Game<b>Nomad</b></span>
      </a>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="search-input" class="search-input" type="search" placeholder="Search game deals, platforms..." aria-label="Search game deals"/>
        <button id="search-clear" class="search-clear" aria-label="Clear search">✕</button>
      </div>

      <div class="header-actions">
        <div class="social-pills" id="social-links"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- HERO CAROUSEL: MAX 4 TRENDING GAMES -->
    <section class="carousel-section" id="carousel-section" aria-label="Featured Game Deals">
      <div class="carousel-wrap" id="carousel-wrap">
        <div class="carousel-track" id="carousel-track"></div>

        <!-- Controls -->
        <button class="carousel-nav-btn carousel-prev" id="carousel-prev" aria-label="Previous Deal">‹</button>
        <button class="carousel-nav-btn carousel-next" id="carousel-next" aria-label="Next Deal">›</button>

        <div class="carousel-controls-bar">
          <span class="carousel-counter" id="carousel-counter">01 / 04</span>
          <div class="carousel-dots" id="carousel-dots"></div>
        </div>
      </div>
    </section>

    <!-- Filters & Sort -->
    <section class="filter-section">
      <div class="tabs-row" id="tabs-container"></div>

      <div class="sort-row">
        <div class="results-heading">
          <span id="category-title">All Deals</span>
          <span class="results-count" id="results-count"></span>
        </div>

        <div class="sort-select-wrap">
          <label for="sort-select" class="sort-label">Sort by:</label>
          <select id="sort-select" class="sort-select" aria-label="Sort games">
            <option value="discount">Biggest Discount</option>
            <option value="price-asc">Lowest Price</option>
            <option value="title">Title (A-Z)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Games Grid -->
    <div class="games-grid" id="games-grid"></div>
  </main>

  <!-- Game Details Dialog -->
  <dialog id="dlg" aria-labelledby="dlg-title">
    <div class="dlg-inner" id="dlg-content"></div>
  </dialog>

  <!-- Deal Spotlight Pop-up Modal -->
  <div class="spotlight-popup" id="spotlight-popup" role="dialog" aria-label="Deal Spotlight">
    <div class="spotlight-header">
      <span class="spotlight-badge" id="spotlight-badge">⚡ SPECIAL DEAL SPOTLIGHT</span>
      <button class="spotlight-close" id="spotlight-close" aria-label="Dismiss spotlight">✕</button>
    </div>
    <div class="spotlight-body">
      <div class="spotlight-thumb" id="spotlight-thumb"></div>
      <div class="spotlight-info">
        <h4 class="spotlight-title" id="spotlight-title">Game Title</h4>
        <div class="spotlight-pricing" id="spotlight-pricing"></div>
        <a class="spotlight-cta" id="spotlight-cta" href="#" target="_blank" rel="sponsored noopener">
          Claim Deal Now 🚀
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <div class="footer-links" id="legal-links"></div>
      <p class="footer-disclosure" id="footer-disclosure"></p>
      <p class="footer-copy">Trademarks belong to their respective owners. Prices and availability are subject to change. Always verify the price on the store page before purchasing.</p>
    </div>
  </footer>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Legal Pages links
    const LEGAL_PAGES = [
      ["privacy", "Privacy Policy"],
      ["terms", "Terms of Use"],
      ["affiliate-disclosure", "Affiliate Disclosure"],
      ["cookies", "Cookie Policy"],
      ["contact", "Contact & Disclaimer"]
    ];

    const PLATFORMS_LIST = ["PC", "Xbox", "PlayStation", "Nintendo", "Gift Cards"];

    let DATA = { games: [], trending: [], site: {}, disclosure: "", popup: {} };
    let currentCategory = "all";
    let searchQuery = "";
    let sortBy = "discount";
    let activeSlideIndex = 0;
    let carouselTimer = null;
    let featuredGames = [];

    // Format currency price
    function formatPrice(val, store) {
      if (val == null || isNaN(val)) return null;
      const symbol = store === "instantgaming" ? "€" : "$";
      return `${symbol}${Number(val).toFixed(2)}`;
    }

    // Filter helper
    function gameMatchesCategory(game, cat) {
      if (cat === "all") return true;
      if (cat === "sale") return !!(game.discount && game.discount > 0);
      if (cat === "daily-deals" || cat === "daily") return !!game.daily_deal;
      if (cat === "preorders" || cat === "preorder") return !!game.preorder;
      if (cat === "upcoming") return !!game.upcoming;
      if (cat === "wish") return !!game.wishlist;
      if (cat === "instantgaming" || cat === "indiegala" || cat === "steam" || cat === "epic" || cat === "gog") return game.store === cat;
      return (game.platforms || []).some(p => p.toLowerCase() === cat.toLowerCase());
    }

    // Get Featured games for Carousel (Max 4)
    function getCarouselGames() {
      // 1. Trending ids explicitly chosen
      const trendingGames = (DATA.trending || [])
        .map(id => DATA.games.find(g => g.id === id))
        .filter(g => g && g.title && g.image);

      // 2. Fill up to 4 with highest discount games that have images
      const remaining = DATA.games
        .filter(g => g && g.image && !trendingGames.some(t => t.id === g.id))
        .sort((a, b) => (b.discount || 0) - (a.discount || 0));

      return [...trendingGames, ...remaining].slice(0, 4);
    }

    // Render Navigation Tabs (including Daily Deals, Pre-orders, Upcoming)
    function renderTabs() {
      const tabs = [
        { id: "all", label: "🔥 All Deals" },
        { id: "daily-deals", label: "⚡ Daily Deals" },
        { id: "preorders", label: "⏳ Pre-orders" },
        { id: "upcoming", label: "🚀 Upcoming" },
        { id: "sale", label: "💥 Big Sales" }
      ];

      // Add platform tabs
      PLATFORMS_LIST.forEach(p => {
        const count = DATA.games.filter(g => gameMatchesCategory(g, p)).length;
        if (count > 0) {
          tabs.push({ id: p, label: p, count });
        }
      });

      // Stores
      if (DATA.games.some(g => g.store === "instantgaming")) {
        tabs.push({ id: "instantgaming", label: "Instant Gaming" });
      }
      if (DATA.games.some(g => g.store === "indiegala")) {
        tabs.push({ id: "indiegala", label: "IndieGala" });
      }
      if (DATA.games.some(g => g.store === "steam")) {
        tabs.push({ id: "steam", label: "Steam" });
      }

      $("tabs-container").innerHTML = tabs.map(t => {
        const count = t.count ?? DATA.games.filter(g => gameMatchesCategory(g, t.id)).length;
        const isActive = t.id === currentCategory ? "active" : "";
        return `<button class="tab-btn ${isActive}" data-category="${esc(t.id)}">
          ${esc(t.label)} <span class="tab-count">${count}</span>
        </button>`;
      }).join("");
    }

    // Render Carousel (4 Max)
    function renderCarousel() {
      featuredGames = getCarouselGames();
      const wrap = $("carousel-section");

      if (!featuredGames.length || searchQuery.trim().length > 0) {
        wrap.style.display = "none";
        clearInterval(carouselTimer);
        return;
      }
      wrap.style.display = "block";

      const total = featuredGames.length;
      if (activeSlideIndex >= total) activeSlideIndex = 0;

      $("carousel-track").innerHTML = featuredGames.map((g, i) => {
        const isActive = i === activeSlideIndex ? "active" : "";
        const formattedPrice = formatPrice(g.price, g.store);
        const formattedOldPrice = formatPrice(g.old_price, g.store);
        const saveAmount = g.price && g.old_price && g.old_price > g.price 
          ? formatPrice(g.old_price - g.price, g.store) 
          : null;

        const platformBadges = (g.platforms || []).map(p => 
          `<span class="badge">${esc(p)}</span>`
        ).join("");

        const storeLabel = g.store === "instantgaming" ? "Instant Gaming" : (g.store === "indiegala" ? "IndieGala" : (g.store === "steam" ? "Steam" : g.store));

        return `
          <div class="carousel-slide ${isActive}" style="background-image: url('${esc(g.image)}')" data-index="${i}">
            <div class="carousel-overlay"></div>
            <div class="carousel-content">
              <div class="badge-row">
                <span class="badge featured-tag">⭐ Featured Deal</span>
                ${g.daily_deal ? `<span class="badge daily-pill">⚡ Daily Deal</span>` : ""}
                ${g.preorder ? `<span class="badge preorder-pill">⏳ Pre-order</span>` : ""}
                ${g.discount ? `<span class="badge discount-pill">-${g.discount}% OFF</span>` : ""}
                <span class="badge store-tag">${esc(storeLabel)}</span>
                ${platformBadges}
              </div>

              <h2 class="carousel-title">${esc(g.title)}</h2>

              ${g.description ? `<p class="carousel-desc">${esc(g.description)}</p>` : ""}

              <div class="carousel-price-row">
                ${formattedPrice ? `<span class="price-main">${formattedPrice}</span>` : `<span class="price-main" style="font-size:22px">Check Store</span>`}
                ${formattedOldPrice ? `<span class="price-old">${formattedOldPrice}</span>` : ""}
                ${saveAmount ? `<span class="price-save">Save ${saveAmount}</span>` : ""}
              </div>

              <div class="carousel-actions">
                <a class="btn-primary" href="${esc(g.link)}" target="_blank" rel="sponsored noopener">
                  Get This Deal 🚀
                </a>
                <button class="btn-secondary" onclick="openDetails('${esc(g.id)}')">
                  Quick View ℹ️
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      $("carousel-counter").textContent = `0${activeSlideIndex + 1} / 0${total}`;
      $("carousel-dots").innerHTML = featuredGames.map((_, i) => 
        `<span class="carousel-dot ${i === activeSlideIndex ? "active" : ""}" data-slide="${i}"></span>`
      ).join("");

      startCarouselAutoplay();
    }

    function goToSlide(index) {
      const total = featuredGames.length;
      if (total <= 1) return;
      activeSlideIndex = (index + total) % total;

      const slides = document.querySelectorAll(".carousel-slide");
      slides.forEach((s, i) => {
        if (i === activeSlideIndex) s.classList.add("active");
        else s.classList.remove("active");
      });

      $("carousel-counter").textContent = `0${activeSlideIndex + 1} / 0${total}`;
      const dots = document.querySelectorAll(".carousel-dot");
      dots.forEach((d, i) => {
        if (i === activeSlideIndex) d.classList.add("active");
        else d.classList.remove("active");
      });
    }

    function startCarouselAutoplay() {
      clearInterval(carouselTimer);
      if (featuredGames.length <= 1) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      carouselTimer = setInterval(() => {
        goToSlide(activeSlideIndex + 1);
      }, 5500);
    }

    // Render Game Cards Grid
    function renderGrid() {
      let filtered = DATA.games.filter(g => {
        const matchesCat = gameMatchesCategory(g, currentCategory);
        const matchesQuery = !searchQuery || g.title.toLowerCase().includes(searchQuery) ||
          (g.description && g.description.toLowerCase().includes(searchQuery)) ||
          (g.platforms && g.platforms.some(p => p.toLowerCase().includes(searchQuery)));
        return matchesCat && matchesQuery;
      });

      // Sorting
      if (sortBy === "discount") {
        filtered.sort((a, b) => (b.discount || 0) - (a.discount || 0));
      } else if (sortBy === "price-asc") {
        filtered.sort((a, b) => (a.price || 9999) - (b.price || 9999));
      } else if (sortBy === "title") {
        filtered.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
      }

      const catTitles = {
        all: "All Game Deals",
        "daily-deals": "⚡ Instant Gaming & Store Daily Deals",
        preorders: "⏳ Pre-orders & Guaranteed Day 1 Keys",
        upcoming: "🚀 Upcoming Game Releases",
        sale: "💥 Top Discounted Deals",
        wish: "Wishlist Games",
        instantgaming: "Instant Gaming Deals",
        indiegala: "IndieGala Deals",
        steam: "Steam Deals"
      };
      $("category-title").textContent = catTitles[currentCategory] || `${currentCategory} Deals`;
      $("results-count").textContent = `(${filtered.length} found)`;

      if (!filtered.length) {
        $("games-grid").innerHTML = `
          <div class="empty-state">
            <h3>No games found in this category</h3>
            <p>Try switching categories or clearing search filters.</p>
            <button class="btn-secondary" onclick="resetFilters()">Reset All Filters</button>
          </div>
        `;
        return;
      }

      $("games-grid").innerHTML = filtered.map(g => {
        const formattedPrice = formatPrice(g.price, g.store);
        const formattedOldPrice = formatPrice(g.old_price, g.store);
        const storeLabel = g.store === "instantgaming" ? "Instant Gaming" : (g.store === "indiegala" ? "IndieGala" : (g.store === "steam" ? "Steam" : g.store));

        const platformsHtml = (g.platforms || []).map(p => 
          `<span class="platform-pill">${esc(p)}</span>`
        ).join("");

        return `
          <article class="game-card" data-id="${esc(g.id)}">
            <div class="card-thumb-wrap" onclick="openDetails('${esc(g.id)}')">
              ${g.image 
                ? `<img class="card-thumb" src="${esc(g.image)}" alt="${esc(g.title)}" loading="lazy" onerror="this.src='logo.svg'"/>`
                : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mute)">No Image</div>`
              }
              <div class="card-overlay-badge">
                ${g.daily_deal ? `<span class="badge daily-pill">⚡ DAILY</span>` : ""}
                ${g.preorder ? `<span class="badge preorder-pill">⏳ PRE-ORDER</span>` : ""}
                ${g.discount ? `<span class="badge discount-pill">-${g.discount}%</span>` : ""}
              </div>
              <div class="card-store-badge">${esc(storeLabel)}</div>
            </div>

            <div class="card-body">
              <div class="card-platforms">${platformsHtml}</div>
              <h3 class="card-title" onclick="openDetails('${esc(g.id)}')">${esc(g.title)}</h3>
              ${g.description ? `<p class="card-desc">${esc(g.description)}</p>` : ""}

              <div class="card-pricing-row">
                <div class="card-price-box">
                  <span class="card-price-current">${formattedPrice || "Check Price"}</span>
                  ${formattedOldPrice ? `<span class="card-price-old">${formattedOldPrice}</span>` : ""}
                </div>

                <a class="card-deal-btn" href="${esc(g.link)}" target="_blank" rel="sponsored noopener">
                  Get Deal ↗
                </a>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    // Modal Details Dialog
    window.openDetails = function(gid) {
      const g = DATA.games.find(x => x.id === gid);
      if (!g) return;

      const formattedPrice = formatPrice(g.price, g.store);
      const formattedOldPrice = formatPrice(g.old_price, g.store);
      const storeLabel = g.store === "instantgaming" ? "Instant Gaming" : (g.store === "indiegala" ? "IndieGala" : (g.store === "steam" ? "Steam" : g.store));
      const platformsHtml = (g.platforms || []).map(p => `<span class="badge">${esc(p)}</span>`).join("");

      $("dlg-content").innerHTML = `
        <button class="dlg-close" onclick="$('dlg').close()" aria-label="Close dialog">✕</button>
        <div class="dlg-thumb" style="background-image: url('${esc(g.image || "")}')"></div>
        <div class="dlg-body">
          <div class="badge-row">
            ${g.daily_deal ? `<span class="badge daily-pill">⚡ Daily Deal</span>` : ""}
            ${g.preorder ? `<span class="badge preorder-pill">⏳ Pre-order</span>` : ""}
            ${g.discount ? `<span class="badge discount-pill">-${g.discount}% OFF</span>` : ""}
            <span class="badge store-tag">${esc(storeLabel)}</span>
            ${platformsHtml}
          </div>

          <h2 class="dlg-title" id="dlg-title">${esc(g.title)}</h2>

          <div class="carousel-price-row" style="margin:0">
            <span class="price-main">${formattedPrice || "Check Price"}</span>
            ${formattedOldPrice ? `<span class="price-old">${formattedOldPrice}</span>` : ""}
          </div>

          <p class="dlg-desc">${esc(g.description || "Grab this game at a great discount. Follow the link below directly to the store deal page.")}</p>

          <div class="dlg-meta">
            <a class="btn-primary" href="${esc(g.link)}" target="_blank" rel="sponsored noopener" style="width:100%;justify-content:center">
              Visit Store to Claim Deal 🚀
            </a>
            <small class="dlg-disclosure">${esc(DATA.disclosure || "Affiliate link: we may earn a small commission at no additional cost to you.")}</small>
          </div>
        </div>
      `;

      $("dlg").showModal();
    };

    // Deal Spotlight Pop-up Initialization
    function initSpotlightPopup() {
      const popCfg = DATA.popup || {};
      if (!popCfg.enabled && popCfg.enabled !== undefined) return;
      if (sessionStorage.getItem("spotlight_dismissed")) return;

      const type = popCfg.type || "discount";
      let target = null;

      if (type === "custom" && popCfg.game_id) {
        target = DATA.games.find(g => g.id === popCfg.game_id);
      } else if (type === "daily_deal") {
        target = DATA.games.find(g => g.daily_deal && g.image) || DATA.games.find(g => g.daily_deal);
      } else if (type === "preorder") {
        target = DATA.games.find(g => g.preorder && g.image) || DATA.games.find(g => g.preorder);
      }

      // Default or fallback to biggest discount
      if (!target) {
        target = [...DATA.games].filter(g => g.image).sort((a,b) => (b.discount || 0) - (a.discount || 0))[0];
      }

      if (!target) return;

      const formattedPrice = formatPrice(target.price, target.store);
      const formattedOldPrice = formatPrice(target.old_price, target.store);

      $("spotlight-badge").innerHTML = esc(popCfg.title || "⚡ SPECIAL DEAL SPOTLIGHT");
      $("spotlight-title").textContent = target.title;
      $("spotlight-title").title = target.title;
      $("spotlight-thumb").style.backgroundImage = target.image ? `url('${esc(target.image)}')` : "none";
      $("spotlight-pricing").innerHTML = `
        <span class="spotlight-price">${formattedPrice || "Check Store"}</span>
        ${formattedOldPrice ? `<span style="font-size:12px;color:var(--mute);text-decoration:line-through">${formattedOldPrice}</span>` : ""}
        ${target.discount ? `<span style="font-size:11px;color:#fff;background:var(--discount);padding:1px 6px;border-radius:4px;font-weight:700">-${target.discount}%</span>` : ""}
      `;
      $("spotlight-cta").href = target.link;

      // Show popup with a slight delay
      setTimeout(() => {
        const p = $("spotlight-popup");
        if (p) p.style.display = "block";
      }, 1600);

      $("spotlight-close").onclick = () => {
        $("spotlight-popup").style.display = "none";
        sessionStorage.setItem("spotlight_dismissed", "1");
      };
    }

    function resetFilters() {
      currentCategory = "all";
      searchQuery = "";
      $("search-input").value = "";
      $("search-clear").style.display = "none";
      renderTabs();
      renderCarousel();
      renderGrid();
    }

    // Event Handlers
    $("tabs-container").addEventListener("click", e => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      currentCategory = btn.dataset.category;
      renderTabs();
      renderGrid();
    });

    $("sort-select").addEventListener("change", e => {
      sortBy = e.target.value;
      renderGrid();
    });

    $("search-input").addEventListener("input", e => {
      searchQuery = e.target.value.toLowerCase().trim();
      $("search-clear").style.display = searchQuery ? "block" : "none";
      renderCarousel();
      renderGrid();
    });

    $("search-clear").addEventListener("click", () => {
      $("search-input").value = "";
      searchQuery = "";
      $("search-clear").style.display = "none";
      renderCarousel();
      renderGrid();
    });

    // Carousel Navigation
    $("carousel-prev").addEventListener("click", () => {
      goToSlide(activeSlideIndex - 1);
      startCarouselAutoplay();
    });
    $("carousel-next").addEventListener("click", () => {
      goToSlide(activeSlideIndex + 1);
      startCarouselAutoplay();
    });
    $("carousel-dots").addEventListener("click", e => {
      const dot = e.target.closest(".carousel-dot");
      if (!dot) return;
      goToSlide(Number(dot.dataset.slide));
      startCarouselAutoplay();
    });

    const wrapEl = $("carousel-wrap");
    wrapEl.addEventListener("mouseenter", () => clearInterval(carouselTimer));
    wrapEl.addEventListener("mouseleave", () => startCarouselAutoplay());

    let touchStartX = 0;
    wrapEl.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].screenX;
      clearInterval(carouselTimer);
    }, { passive: true });
    wrapEl.addEventListener("touchend", e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 45) {
        goToSlide(activeSlideIndex + 1);
      } else if (touchEndX - touchStartX > 45) {
        goToSlide(activeSlideIndex - 1);
      }
      startCarouselAutoplay();
    }, { passive: true });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && $("dlg").open) $("dlg").close();
      if ($("carousel-section").style.display !== "none" && !$("dlg").open && document.activeElement.tagName !== "INPUT") {
        if (e.key === "ArrowLeft") goToSlide(activeSlideIndex - 1);
        if (e.key === "ArrowRight") goToSlide(activeSlideIndex + 1);
      }
    });

    $("dlg").addEventListener("click", e => {
      if (e.target === $("dlg")) $("dlg").close();
    });

    // Load games data
    fetch("games.json")
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        DATA = data;
        const brandName = data.site?.name || "GameNomad";
        $("site-brand-name").innerHTML = `${esc(brandName)} Deals`;
        document.title = `${esc(brandName)} - Daily Deals, Pre-orders & Promos`;

        // Socials
        const socials = data.site?.socials || {};
        $("social-links").innerHTML = Object.entries(socials)
          .filter(([_, url]) => !!url)
          .map(([name, url]) => `<a class="social-btn" href="${esc(url)}" target="_blank" rel="noopener">${esc(name.toUpperCase())}</a>`)
          .join("");

        // Legal Links
        $("legal-links").innerHTML = LEGAL_PAGES.map(([slug, title]) => 
          `<a href="${slug}.html">${esc(title)}</a>`
        ).join("");

        $("footer-disclosure").textContent = data.disclosure || "";

        renderTabs();
        renderCarousel();
        renderGrid();
        initSpotlightPopup();
      })
      .catch(err => {
        console.error("Failed to load games.json:", err);
        $("games-grid").innerHTML = `
          <div class="empty-state">
            <h3>Unable to load game deals</h3>
            <p>Please check back shortly or refresh the page.</p>
          </div>
        `;
      });
  </script>
</body>
</html>
